# Animation registry. Keys are <sprite-key>.<state>.
# gif|path loads every frame from an animated GIF.
# sequence|count|prefix loads prefix_0.png, prefix_1.png, ...
# sheet|count|path slices a horizontal sprite sheet into equal-width frames.

animation.player_ak47.idle=gif|/player/ak47/idle.gif
animation.player_ak47.walk=gif|/player/ak47/walk.gif
animation.player_ak47.hurt=gif|/player/ak47/hurt.gif
animation.player_ak47.attack=gif|/player/ak47/attack.gif
animation.player_bat.idle=gif|/player/bat/idle.gif
animation.player_bat.walk=gif|/player/bat/walk.gif
animation.player_bat.hurt=gif|/player/bat/hurt.gif
animation.player_bat.attack=gif|/player/bat/attack.gif
animation.player.dash=gif|/player/extras/dash.gif

animation.boss3.idle=sheet|9|/boss3/super-cool-robot-idle.png
animation.boss3.run=sheet|9|/boss3/super-cool-robot-run.png
animation.boss3.fire=sheet|4|/boss3/super-cool-robot-fire.png
animation.boss3.jump=sheet|7|/boss3/super-cool-robot-jump.png

